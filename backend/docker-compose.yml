version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: antitheft-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antitheft_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antitheft_secure_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-antitheft_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antitheft_user} -d ${POSTGRES_DB:-antitheft_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antitheft-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-antitheft_user}:${POSTGRES_PASSWORD:-antitheft_secure_password_dev}@db:5432/${POSTGRES_DB:-antitheft_db}
      SECRET_KEY: ${SECRET_KEY:-temporary-phase2-dev-secret-key-replace-in-production-64char-minimum-length-hash}
      DEBUG: ${DEBUG:-false}
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      LOCATION_RETENTION_DAYS: "30"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
